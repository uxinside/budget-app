<title>우리집 가계부</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
 background:#0B1120;color:#F8FAFC;display:flex;flex-direction:column;
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:0 0 auto}
.tabs{display:flex;background:#1E293B;border-radius:9px;padding:2px;flex:1}
.tabs button{flex:1;border:0;background:none;color:#94A3B8;font:600 14px/1 inherit;padding:8px;border-radius:7px}
.tabs button.on{background:#F8FAFC;color:#0B1120}
.who{display:flex;background:#1E293B;border-radius:9px;padding:2px}
.who button{border:0;background:none;color:#94A3B8;font:600 12px/1 inherit;padding:8px 9px;border-radius:7px}
.who button.on{background:#38BDF8;color:#082F49}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;padding:0 10px 10px;overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:7px}
.scroll::-webkit-scrollbar{display:none}
.card{background:#111C33;border:1px solid #1E293B;border-radius:14px;padding:11px 12px;flex:0 0 auto}
.lbl{font:700 10px/1 inherit;color:#64748B;letter-spacing:.5px;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:1px solid #22304A;background:#16213B;border-radius:999px;
 padding:7px 12px;font:600 13px/1 inherit;color:#94A3B8}
.chips button.on{background:#F8FAFC;border-color:#F8FAFC;color:#0B1120}
.chips button.pay.on{background:#38BDF8;border-color:#38BDF8;color:#082F49}
.chips button.more{border-style:dashed;color:#64748B}
#memo{width:100%;border:1px solid #22304A;background:#16213B;border-radius:11px;
 padding:11px 12px;font:600 14px/1 inherit;color:#F8FAFC}
#memo::placeholder{color:#475569}
.foot{flex:0 0 auto;display:flex;gap:7px;align-items:stretch}
#amtbtn{flex:1;display:flex;align-items:baseline;justify-content:flex-end;gap:5px;
 border:1px solid #22304A;background:#16213B;border-radius:14px;padding:0 14px;min-height:58px}
#amt{font:800 30px/1 inherit;letter-spacing:-1px;font-variant-numeric:tabular-nums;color:#F8FAFC}
#amt.zero{color:#334155}
.won{font:700 14px/1 inherit;color:#64748B}
#qty{border:1px solid #22304A;background:#16213B;border-radius:14px;padding:0 13px;
 font:700 14px/1 inherit;color:#94A3B8}
#save{flex:0 0 108px;border:0;border-radius:14px;background:#38BDF8;color:#082F49;font:700 16px/1 inherit}
#save:disabled{background:#1E293B;color:#475569}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .18s;z-index:8}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#111C33;
 border-radius:22px 22px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom));
 transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(0,0,0,.55)}
#sheet.on{transform:translateY(0)}
.sh{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;padding:2px 8px 12px}
#shAmt{font:800 44px/1 inherit;letter-spacing:-1.5px;color:#F8FAFC;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{border:0;background:#1B2942;border-radius:14px;height:56px;font:600 24px/1 inherit;color:#F1F5F9}
.pad button:active{background:#334155}
.pad button.sm{font-size:18px;color:#94A3B8}
#padok{width:100%;height:54px;margin-top:10px;border:0;border-radius:15px;background:#38BDF8;color:#082F49;font:700 17px/1 inherit}
#instSheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#111C33;
 border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
 transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(0,0,0,.55)}
#instSheet.on{transform:translateY(0)}
.ih{font:800 18px/1 inherit;margin-bottom:14px}
#instSteps{margin:0 0 12px;padding-left:20px}
#instSteps li{font-size:14px;line-height:1.9;color:#CBD5E1}
#instSteps b{color:#38BDF8}
.imut{font-size:12px;color:#64748B;line-height:1.6}
#instClose{width:100%;height:50px;margin-top:14px;border:0;border-radius:14px;
 background:#1E293B;color:#F8FAFC;font:700 15px/1 inherit}
#toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
 background:#F8FAFC;color:#0B1120;border-radius:13px;padding:13px 15px;display:none;
 align-items:center;gap:10px;font:700 14px/1 inherit;z-index:10}
#toast button{margin-left:auto;border:0;background:#0B1120;color:#fff;border-radius:8px;padding:8px 12px;font:700 13px/1 inherit}
.big{font:800 30px/1 inherit;letter-spacing:-1px}
.sub{color:#64748B;font-size:12px;margin-top:5px}

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var K={who:'budget.who',queue:'budget.queue',learn:'budget.learn'};
var DEMO=(typeof google==='undefined'||!google.script);
var M=null, OV=null, lastRow=0, USERS=[];
var GUBUNS=['지출','수입','저축/투자','부채상환'];
var FALLBACK={'수입':['근로소득','금융소득','기타수입'],
 '저축/투자':['예적금','청약저축','투자'],'부채상환':['주택담보대출','자동차할부','대출']};
var st={amt:0,gubun:'지출',cat:null,pay:null,qty:1,user:localStorage.getItem(K.who)||'',memo:''};
var openC=false, openP=false;

function n(x){return (Number(x)||0).toLocaleString('ko-KR')}
function man(x){x=Number(x)||0; return x>=10000000?(x/100000000).toFixed(2)+'억'
  :x>=10000?Math.round(x/10000).toLocaleString('ko-KR')+'만':n(x)}
function today(){var d=new Date(),p=function(v){return(v<10?'0':'')+v};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
/* ── 사용처 학습: 입력할 때마다 (카테고리·내용) 횟수를 센다 ── */
function learnGet(){try{return JSON.parse(localStorage.getItem(K.learn))||{}}catch(e){return {}}}
function learnAdd(cat,memo){
  if(!cat||!memo) return;
  var L=learnGet(); L[cat]=L[cat]||{};
  L[cat][memo]=(L[cat][memo]||0)+1;
  try{localStorage.setItem(K.learn,JSON.stringify(L))}catch(e){}
}
function placesOf(cat){
  var seed=(window.PLACES&&window.PLACES[cat])||[];
  var L=learnGet()[cat]||{};
  var seen={}, out=[];
  Object.keys(L).sort(function(a,b){return L[b]-L[a]}).forEach(function(k){
    if(L[k]>=1&&!seen[k]){seen[k]=1;out.push(k)}});      // 내가 쓴 곳이 먼저
  seed.forEach(function(k){if(!seen[k]&&(L[k]||0)>-1){seen[k]=1;out.push(k)}});
  return out.slice(0,10);
}
function order(list,freq){var f={};freq.forEach(function(v,i){f[v]=i});
  return list.slice().sort(function(a,b){
    return (f[a]===undefined?999:f[a])-(f[b]===undefined?999:f[b])})}

/* ───────── 렌더 ───────── */
function paintWho(){
  $('who').innerHTML=USERS.map(function(u){
    return '<button data-u="'+u+'" class="'+(st.user===u?'on':'')+'">'+u+'</button>'}).join('')}
function chipHtml(list,sel,attr,cls,open,max){
  var vis=open?list:list.slice(0,max);
  if(sel&&vis.indexOf(sel)<0&&list.indexOf(sel)>=0) vis=vis.slice(0,max-1).concat([sel]);
  var h=vis.map(function(v){
    return '<button data-'+attr+'="'+v+'" class="'+cls+(sel===v?' on':'')+'">'+v+'</button>'}).join('');
  if(list.length>max) h+='<button class="more" data-more="'+attr+'">'+(open?'접기':'＋'+(list.length-max))+'</button>';
  return h}
function paintCats(){$('cats').innerHTML=chipHtml(window.CATS||[],st.cat,'c','',openC,12)}
function paintPays(){
  var pl=window.PAYS||[];
  $('pays').innerHTML=pl.length?chipHtml(pl,st.pay,'p','pay ',openP,10)
    :'<span class="mut" style="font-size:12px">계좌 시트에 '+st.user+' 소유 계좌를 넣어주세요</span>';
  var a=ACC[st.pay], el=$('payInfo');
  if(el) el.textContent=(a&&(a.no||a.owner))?
    [a.owner,a.org,a.no].filter(Boolean).join(' · '):'';}
function paintPlaces(){
  var list=st.cat?placesOf(st.cat):[];
  $('placeCard').classList.toggle('hide',!list.length);
  $('places').innerHTML=list.map(function(v){
    return '<button data-pl="'+v+'" class="'+(st.memo===v?'on':'')+'">'+v+'</button>'}).join('')}
function paintAmt(){
  var t=st.amt*st.qty;
  $('amt').textContent=n(t); $('amt').className=t?'':'zero';
  $('shAmt').textContent=n(t); $('qty').textContent='×'+st.qty;
  $('save').disabled=!(st.amt>0&&st.cat&&st.pay)}
function paint(){paintWho();paintCats();paintPays();paintPlaces();paintAmt()}

function setGubun(g){
  st.gubun=g;
  var list=(M&&M.cats&&M.cats[g])||FALLBACK[g]||window.CATORDER;
  window.CATS=(g==='지출')?order(list,window.CATORDER):list;
  if(window.CATS.indexOf(st.cat)<0){st.cat=null;st.memo='';$('memo').value=''}
  $('gbtn').textContent=g;
  $('gbtn').style.background=g==='수입'?'#052E1B':(g==='지출'?'#3F1D1D':'#1E1B4B');
  $('gbtn').style.color=g==='수입'?'#86EFAC':(g==='지출'?'#FCA5A5':'#A5B4FC')}
var ACC={}, ACCLIST=[];
function payListFor(u){
  if(!ACCLIST.length) return window.PAYS_ALL||[];

    return !o||o===u||o==='공동'});
  return order(f.map(function(x){return x.name}),window.FREQ_PAY)}

  window.PAYS=payListFor(st.user);
  if(st.pay&&window.PAYS.indexOf(st.pay)<0) st.pay=null;

function applyMaster(m){

  }else if(!DEMO) google.script.run.withSuccessHandler(function(list){
    ACCLIST=list||[]; ACCLIST.forEach(function(a){ACC[a.name]=a}); syncPays()
  }).withFailureHandler(function(){}).listAccounts();
  if(!st.user||USERS.indexOf(st.user)<0) st.user=USERS[0];
  window.PAYS_ALL=order((m.pay||[]).length?m.pay:window.FREQ_PAY,window.FREQ_PAY);
  window.PAYS=payListFor(st.user);
  setGubun(st.gubun); paint()}


/* ───────── 번다운 ───────── */
function renderBd(b){
  var el=$('bdChart'); if(!el) return;
  if(!b||!b.dim||!b.budget){
    el.innerHTML='<div class="mut" style="font-size:13px">예산을 넣으면 표시됩니다</div>';
    $('bdLegend').innerHTML=''; $('bdNum').innerHTML=''; return}
  var W=320,H=118,PL=4,PR=4,PT=8,PB=14,B=b.budget,D=b.dim;
  var lows=[B-(b.hiTotal||0),B-(b.loTotal||0),B-(b.prevTotal||0),0];
  var cn=null; for(var i=0;i<b.cur.length;i++) if(b.cur[i]!==null) cn=b.cur[i];
  lows.push(B-(cn||0));
  var lo=Math.min.apply(null,lows), hi=B;
  var pad=(hi-lo)*0.08||1; lo-=pad; hi+=pad;
  var X=function(d){return PL+(d-1)*(W-PL-PR)/Math.max(1,D-1)};
  var Y=function(v){return PT+(hi-v)/(hi-lo)*(H-PT-PB)};
  function line(arr,upto){var p='',f=true;
    for(var i=0;i<arr.length&&i<D;i++){var v=arr[i];
      if(v===null||v===undefined) break;
      if(upto&&i+1>upto) break;
      p+=(f?'M':'L')+X(i+1).toFixed(1)+' '+Y(B-v).toFixed(1); f=false}
    return p}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="none">';
  if(lo<0&&hi>0) s+='<line x1="'+PL+'" y1="'+Y(0)+'" x2="'+(W-PR)+'" y2="'+Y(0)+'" stroke="#334155" stroke-width="1"/>';
  s+='<path d="M'+X(1)+' '+Y(B)+'L'+X(D)+' '+Y(0)+'" stroke="#475569" stroke-width="1" stroke-dasharray="3 3" fill="none"/>';
  if(b.hiTotal) s+='<line x1="'+PL+'" y1="'+Y(B-b.hiTotal)+'" x2="'+(W-PR)+'" y2="'+Y(B-b.hiTotal)+'" stroke="#F87171" stroke-width="1" stroke-dasharray="1 4"/>';
  if(b.loTotal) s+='<line x1="'+PL+'" y1="'+Y(B-b.loTotal)+'" x2="'+(W-PR)+'" y2="'+Y(B-b.loTotal)+'" stroke="#86EFAC" stroke-width="1" stroke-dasharray="1 4"/>';
  if(b.prev&&b.prev.length) s+='<path d="'+line(b.prev)+'" stroke="#64748B" stroke-width="1.5" fill="none"/>';
  s+='<path d="'+line(b.cur,b.day)+'" stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linejoin="round"/>';
  if(cn!==null) s+='<circle cx="'+X(b.day)+'" cy="'+Y(B-cn)+'" r="3" fill="#38BDF8"/>';
  s+='</svg>'; el.innerHTML=s;
  $('bdSub').textContent=b.day+'일차 / '+D+'일';
  $('bdLegend').innerHTML=
    '<span><i style="border-color:#38BDF8"></i>이번 달</span>'+
    (b.prevYm?'<span><i style="border-color:#64748B"></i>전월('+b.prevYm.slice(5)+')</span>':'')+
    '<span><i style="border-color:#475569;border-top-style:dashed"></i>예산 균등</span>'+
    (b.loYm?'<span><i style="border-color:#86EFAC;border-top-style:dotted"></i>최저('+b.loYm.slice(5)+')</span>':'')+
    (b.hiYm?'<span><i style="border-color:#F87171;border-top-style:dotted"></i>최고('+b.hiYm.slice(5)+')</span>':'');
  var used=cn||0, ideal=B*b.day/D, gap=used-ideal;
  var pv=(b.prev&&b.prev[b.day-1])||0, pgap=used-pv;
  $('bdNum').innerHTML=
    '<span class="mut">남은 예산</span><b style="color:'+(B-used>=0?'#86EFAC':'#FCA5A5')+'">'+n(B-used)+'원</b>';
  $('bdNum').insertAdjacentHTML('afterend',
    '<div class="bdnum"><span class="mut">균등선 대비</span><b style="color:'+(gap<=0?'#86EFAC':'#FCA5A5')+'">'+
    (gap<=0?'':'+')+n(Math.round(gap))+'원</b></div>'+
    '<div class="bdnum"><span class="mut">전월 같은 날 대비</span><b style="color:'+(pgap<=0?'#86EFAC':'#FCA5A5')+'">'+
    (pgap<=0?'':'+')+n(Math.round(pgap))+'원</b></div>');
}

/* ───────── 대시보드 ───────── */
function renderHome(){
  if(!OV){return}
  var o=OV;
  $('hMonth').textContent=o.ym+' · 이번 달';
  $('hNet').textContent=(o.net>=0?'+':'')+n(o.net)+'원';
  $('hNet').style.color=o.net>=0?'#86EFAC':'#FCA5A5';
  $('hNetSub').textContent=o.net>=0?'이만큼 남겼습니다':'이만큼 모자랍니다';
  $('hIn').textContent=man(o.income); $('hSp').textContent=man(o.spend); $('hFx').textContent=man(o.fixed);
  var cs=(o.cats||[]).slice(0,6);
  $('hCats').innerHTML=cs.length?cs.map(function(c){
    var pct=c.budget?Math.min(100,Math.round(c.spend/c.budget*100)):0, over=c.budget&&c.spend>c.budget;
    return '<div style="padding:6px 0"><div style="display:flex;justify-content:space-between;font-size:13px">'+
      '<span>'+c.cat+'</span><span class="'+(over?'':'mut')+'" style="'+(over?'color:#FCA5A5':'')+'">'+
      n(c.spend)+(c.budget?' / '+n(c.budget):'')+'</span></div>'+
      (c.budget?'<div class="bmeter"><i class="'+(over?'over':'')+'" style="width:'+pct+'%"></i></div>':'')+'</div>'
  }).join(''):'<div class="mut" style="font-size:13px">예산 시트에 항목을 넣으면 여기 표시됩니다</div>';
  var t=o.trend||[], mx=Math.max(1,Math.max.apply(null,t.map(function(x){return Math.max(x.income,x.spend)})));
  $('hTrend').innerHTML=t.map(function(x){
    return '<div><u class="sp" style="height:'+Math.round(x.spend/mx*46)+'px"></u>'+
      '<u style="height:'+Math.round(x.income/mx*46)+'px"></u><span>'+x.m.slice(5)+'</span></div>'}).join('');
  $('hWorth').textContent=man(o.worth)+'원';
  $('hDelta').textContent=(o.delta>=0?'전월보다 +':'전월보다 ')+man(o.delta)+'원';
  $('hDelta').style.color=o.delta>=0?'#86EFAC':'#FCA5A5';
  $('hAsset').textContent=man(o.asset); $('hLiab').textContent=man(o.liab);
  var ex=document.querySelectorAll('#bdNum ~ .bdnum'); for(var q=0;q<ex.length;q++) ex[q].remove();
  renderBd(o.bd);
}
function renderRecent(rec){
  $('hRecent').innerHTML=(rec&&rec.length)?rec.map(function(r){
    return '<div class="row"><span>'+(r.memo||r.cat)+' <span class="mut">'+(r.gubun||'')+'</span></span>'+
           '<b>'+n(r.amt)+'</b></div>'}).join(''):'<div class="mut" style="font-size:13px">아직 없습니다</div>'}

/* ───────── 이벤트 ───────── */
$('who').onclick=function(e){var b=e.target.closest('button');if(!b)return;
  st.user=b.dataset.u; localStorage.setItem(K.who,st.user); paintWho(); syncPays()};
$('cats').onclick=function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.more){openC=!openC;paintCats();return}
  var c=b.dataset.c;
  if(st.cat===c){st.cat=null}else{st.cat=c}
  st.memo=''; $('memo').value=''; paintCats(); paintPlaces(); paintAmt()};
$('places').onclick=function(e){var b=e.target.closest('button');if(!b)return;
  var v=b.dataset.pl;
  st.memo=(st.memo===v?'':v); $('memo').value=st.memo; paintPlaces()};
var pressT;
$('places').addEventListener('touchstart',function(e){
  var b=e.target.closest('button'); if(!b)return;
  pressT=setTimeout(function(){hidePlace(b.dataset.pl)},600)},{passive:true});
$('places').addEventListener('touchend',function(){clearTimeout(pressT)},{passive:true});
$('places').addEventListener('contextmenu',function(e){
  var b=e.target.closest('button'); if(!b)return; e.preventDefault(); hidePlace(b.dataset.pl)});
function hidePlace(v){
  if(!v||!st.cat) return;
  var L=learnGet(); L[st.cat]=L[st.cat]||{}; L[st.cat][v]=-999;   // 숨김 표시
  try{localStorage.setItem(K.learn,JSON.stringify(L))}catch(e){}
  if(st.memo===v){st.memo='';$('memo').value=''}
  paintPlaces(); toast('"'+v+'" 목록에서 숨김');
}
$('pays').onclick=function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.more){openP=!openP;paintPays();return}
  st.pay=(st.pay===b.dataset.p?null:b.dataset.p); paintPays(); paintAmt()};
$('memo').oninput=function(){st.memo=$('memo').value; paintPlaces()};
$('qty').onclick=function(){st.qty=st.qty>=5?1:st.qty+1; paintAmt()};
$('gbtn').onclick=function(){setGubun(GUBUNS[(GUBUNS.indexOf(st.gubun)+1)%GUBUNS.length]); paint()};
$('dbtn').onclick=function(){$('date').classList.toggle('hide');$('dbtn').classList.toggle('hide')};
$('date').onchange=function(){var v=$('date').value,t=today();
  $('dbtn').textContent=v===t?'오늘':(+v.slice(5,7))+'월 '+(+v.slice(8,10))+'일';
  $('date').classList.add('hide');$('dbtn').classList.remove('hide')};

$('pad').onclick=function(e){var b=e.target.closest('button');if(!b)return;
  var k=b.dataset.k;
  if(k==='←') st.amt=Math.floor(st.amt/10);
  else st.amt=Math.min(st.amt*(k==='00'?100:10)+(k==='00'?0:+k),99999999);
  paintAmt()};
function openPad(){$('sheet').classList.add('on');$('scrim').classList.add('on')}
function closePad(){$('sheet').classList.remove('on');$('scrim').classList.remove('on')}
$('amtbtn').onclick=openPad; $('padok').onclick=closePad; $('scrim').onclick=function(){closePad();$('instSheet').classList.remove('on');$('scrim').classList.remove('on')};

$('t1').onclick=function(){sw(0)}; $('t2').onclick=function(){sw(1)};
$('t3').onclick=function(){sw(2); if(!MONTHS.length) loadMonths(); else loadList()};
function sw(i){
  ['t1','t2','t3'].forEach(function(t,k){$(t).className=(k===i?'on':'')});
  $('home').classList.toggle('hide',i!==0);
  $('input').classList.toggle('hide',i!==1);
  $('list').classList.toggle('hide',i!==2)}

/* ───────── 내역 (읽기 전용) ───────── */
var MONTHS=[], mIdx=0;
function thisYm(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)}
function loadMonths(){
  if(DEMO){MONTHS=['2026-08','2026-07','2026-06']; mIdx=0; loadList(); return}
  google.script.run.withSuccessHandler(function(ms){
    MONTHS=(ms&&ms.length)?ms:[thisYm()]; mIdx=0; loadList()
  }).withFailureHandler(function(){MONTHS=[thisYm()];mIdx=0;loadList()}).txMonths();
}
function loadList(){
  var ym=MONTHS[mIdx]||thisYm();
  $('mNow').textContent=ym.slice(0,4)+'년 '+(+ym.slice(5,7))+'월';
  $('mPrev').disabled=(mIdx>=MONTHS.length-1); $('mNext').disabled=(mIdx<=0);
  $('lRows').innerHTML='<div class="mut" style="font-size:13px;padding:8px">불러오는 중…</div>';
  if(DEMO){ paintList([{date:ym+'-02',gubun:'지출',cat:'식비',memo:'바나프레소',pay:'하나은행',amt:4000}]); return }
  google.script.run.withSuccessHandler(paintList)
    .withFailureHandler(function(){$('lRows').innerHTML='<div class="mut" style="padding:8px">불러오지 못했습니다</div>'})
    .listTx({ym:ym,n:400});
}
function paintList(list){
  list=list||[];
  var sp=0,cnt=0;
  var html=list.map(function(r){
    if(r.gubun==='지출'){sp+=r.amt;cnt++}
    var cls=r.gubun==='수입'?'in':(r.gubun==='지출'?'':'tr');
    var sign=r.gubun==='수입'?'+':(r.gubun==='지출'?'−':'');
    return '<div class="trow"><span class="d">'+(+r.date.slice(8,10))+'일</span>'+
      '<span class="m">'+(r.memo||r.cat)+'<i>'+r.cat+' · '+r.pay+(r.user?' · '+r.user:'')+'</i></span>'+
      '<span class="a '+cls+'">'+sign+n(r.amt)+'</span></div>'
  }).join('');
  $('lRows').innerHTML=html||'<div class="mut" style="font-size:13px;padding:8px">이 달에는 기록이 없습니다</div>';
  $('lSp').textContent=n(sp)+'원'; $('lCnt').textContent=cnt+'건';
}
$('mPrev').onclick=function(){if(mIdx<MONTHS.length-1){mIdx++;loadList()}};
$('mNext').onclick=function(){if(mIdx>0){mIdx--;loadList()}};

/* ───────── 저장 ───────── */
var LOG=[];
function queue(p){var q=JSON.parse(localStorage.getItem(K.queue)||'[]');q.push(p);
  localStorage.setItem(K.queue,JSON.stringify(q))}
function flush(){if(DEMO)return;
  var q=JSON.parse(localStorage.getItem(K.queue)||'[]'); if(!q.length)return;
  var p=q.shift(); localStorage.setItem(K.queue,JSON.stringify(q));
  google.script.run.withSuccessHandler(flush).withFailureHandler(function(){queue(p)}).addTx(p)}
$('save').onclick=function(){
  var p={date:$('date').value||today(),gubun:st.gubun,cat:st.cat,memo:st.memo,
         pay:st.pay,user:st.user,amount:st.amt*st.qty,fv:'변동'};
  LOG.unshift({cat:p.cat,memo:p.memo,amt:p.amount,gubun:p.gubun});
  learnAdd(p.cat,p.memo);
  toast(p.cat+' '+n(p.amount)+'원 저장');
  if(!DEMO){google.script.run
    .withSuccessHandler(function(res){lastRow=res&&res.row; loadOv(true); flush();
      if(MONTHS.length&&mIdx===0) loadList()})
    .withFailureHandler(function(){queue(p)}).addTx(p)}
  else renderRecent(LOG.slice(0,6));
  st.amt=0;st.cat=null;st.pay=null;st.qty=1;st.memo='';$('memo').value='';
  closePad(); paint()};
var tt;
function toast(m){$('tmsg').textContent=m;$('toast').style.display='flex';
  clearTimeout(tt);tt=setTimeout(function(){$('toast').style.display='none'},3500)}
$('undo').onclick=function(){LOG.shift();$('toast').style.display='none';
  if(!DEMO&&lastRow){google.script.run.withSuccessHandler(function(){loadOv(true)}).undoTx(lastRow);lastRow=0}
  else renderRecent(LOG.slice(0,6))};

/* ───────── 초기화 ───────── */
function loadOv(force){
  if(DEMO)return;
  google.script.run.withSuccessHandler(function(o){
    if(o&&!o.error){OV=o; renderHome()}}).overview(null)}
$('date').value=today();
$('pad').innerHTML=['1','2','3','4','5','6','7','8','9','00','0','←'].map(function(k){
  return '<button data-k="'+k+'"'+(k==='00'||k==='←'?' class="sm"':'')+'>'+k+'</button>'}).join('');
if(DEMO){
  USERS=['폴','아내','공동']; st.user=st.user||'폴';
  window.PAYS=window.FREQ_PAY; setGubun('지출'); paint();
  OV={ym:'2026-08',net:1129049,income:9121049,spend:5338960,fixed:2823498,
      worth:174806044,delta:1129049,asset:551008009,liab:376201965,
      cats:[{cat:'식비',spend:1840519,budget:1800000},{cat:'외식/배달',spend:620000,budget:500000},
            {cat:'교통/차량',spend:264274,budget:300000},{cat:'문화/여가',spend:619191,budget:400000},
            {cat:'생활용품',spend:884801,budget:900000},{cat:'의류/미용',spend:560140,budget:400000}],
      trend:[{m:'2026-03',income:10991014,spend:6931203},{m:'2026-04',income:6111756,spend:6819805},
             {m:'2026-05',income:6073430,spend:5052502},{m:'2026-06',income:9121049,spend:5338960},
             {m:'2026-07',income:3596351,spend:5829247},{m:'2026-08',income:592,spend:330800}]};
  renderHome(); renderRecent([]);
}else{
  google.script.run.withSuccessHandler(function(b){
    applyMaster(b); renderRecent(b.summary&&b.summary.recent); loadOv(); flush()
  }).withFailureHandler(function(){
    USERS=['폴','아내','공동']; st.user=st.user||'폴';
    window.PAYS=window.FREQ_PAY; setGubun('지출'); paint()
  }).bootstrap();
}
/* ───────── 앱 설치 ───────── */
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault(); deferredPrompt=e;
  $('instBtn').textContent='설치';
  $('instSub').textContent='한 번 누르면 바로 설치됩니다';
});
function standalone(){
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
}
function device(){
  var u=navigator.userAgent;
  if(/iPad|iPhone|iPod/.test(u)) return /CriOS|FxiOS|EdgiOS/.test(u)?'ios-other':'ios';
  if(/Android/.test(u)) return 'android';
  return 'desktop';
}
var STEPS={
 'ios':['화면 아래 <b>공유 버튼(⬆)</b>을 누릅니다','목록을 내려 <b>홈 화면에 추가</b>를 찾습니다','오른쪽 위 <b>추가</b>를 누릅니다'],
 'ios-other':['<b>사파리</b>로 이 주소를 다시 엽니다','아래 <b>공유 버튼(⬆)</b> → <b>홈 화면에 추가</b>','아이폰은 사파리에서만 추가됩니다'],
 'android':['오른쪽 위 <b>⋮</b> 를 누릅니다','<b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 고릅니다','<b>추가</b>를 누릅니다'],
 'desktop':['주소창 오른쪽의 <b>설치 아이콘</b>을 누릅니다','없으면 <b>⋮ → 저장 및 공유 → 페이지를 앱으로 설치</b>','폰에서 쓰시려면 이 주소를 폰으로 보내세요']
};
var NOTE='※ 추가하면 주소창 없이 전체화면으로 열립니다. 오프라인 저장까지 되게 하려면 따로 호스팅해야 합니다.';
function showInst(){
  var d=device();
  $('instSteps').innerHTML=STEPS[d].map(function(s){return '<li>'+s+'</li>'}).join('');
  $('instNote').textContent=NOTE;
  $('instSheet').classList.add('on'); $('scrim').classList.add('on');
}
$('instBtn').onclick=function(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(c){
      if(c.outcome==='accepted') $('instCard').classList.add('hide');
      deferredPrompt=null});
    return;
  }
  showInst();
};
$('instClose').onclick=function(){$('instSheet').classList.remove('on');$('scrim').classList.remove('on')};
if(!standalone()) $('instCard').classList.remove('hide');

window.addEventListener('online',flush);
})();

</script></body></html>
