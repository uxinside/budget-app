<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>우리집 가계부</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./favicon.png">
<style>
:root{
  --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --mute:#64748b; --line:#e2e8f0;
  --navy:#0f172a; --green:#16a34a; --red:#dc2626; --amber:#d97706; --blue:#2563eb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--navy);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* ---------- top nav ---------- */
.nav{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;background:var(--navy);flex:0 0 auto}
.nav .seg{display:flex;background:#1e293b;border-radius:10px;padding:3px;flex:1}
.nav .seg button{flex:1;border:0;background:transparent;color:#94a3b8;font-size:14px;font-weight:700;
  padding:8px 0;border-radius:8px}
.nav .seg button.on{background:#f8fafc;color:var(--navy)}
.nav .who{color:#94a3b8;font-size:12px;padding:0 4px;white-space:nowrap;flex:0 0 auto}

.scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:14px 14px 24px}
.hidden{display:none !important}

/* ---------- shared ---------- */
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(15,23,42,.06)}
.lbl{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.02em;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;color:#334155;border-radius:999px;
  padding:8px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.g-수입.on{background:var(--green);border-color:var(--green)}
.chip.g-지출.on{background:var(--red);border-color:var(--red)}

/* ---------- input screen ---------- */
.amt{background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.amt .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.amt .val{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.15;flex:1;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt .val.zero{color:#475569}
#dayin{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:9px;
  padding:8px 9px;font-size:13px;min-width:130px}
#dayin.past{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.quick{display:flex;gap:6px;margin-top:10px}
.quick button{flex:1;border:1px solid #334155;background:#1e293b;color:#cbd5e1;
  border-radius:9px;padding:7px 0;font-size:12px;font-weight:700}

.pad3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.pad3 button{border:0;background:#fff;border-radius:12px;padding:15px 0;font-size:21px;font-weight:700;
  color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.06)}
.pad3 button.sm{font-size:15px;color:var(--mute)}
.pad3 button:active{background:#e2e8f0}

.save{width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:800;
  background:var(--navy);color:#fff}
.save:disabled{background:#cbd5e1;color:#94a3b8}
.save.busy{background:#334155}

.recent{font-size:13px;color:#475569}
.recent div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.recent div:last-child{border-bottom:0}
.recent .a{font-variant-numeric:tabular-nums;font-weight:700}
.recent .a.in{color:var(--green)}

/* ---------- stat screen ---------- */
.mrow{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
.mrow button{border:0;background:#fff;border-radius:10px;width:36px;height:36px;font-size:18px;
  color:#334155;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.mrow span{font-size:17px;font-weight:800;min-width:104px;text-align:center}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--mute);margin-top:3px}
.kv{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)}

.catline{margin-bottom:11px}
.catline .row{font-size:13px;margin-bottom:5px}
.catline .row b{font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.track i.warn{background:var(--amber)} .track i.over{background:var(--red)}

.bars{display:flex;align-items:flex-end;gap:9px;height:120px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.bars .stack{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.bars .stack i{width:42%;border-radius:3px 3px 0 0;min-height:2px;display:block}
.bars .stack i.inc{background:var(--green)} .bars .stack i.exp{background:var(--red)}
.bars .b small{font-size:10px;color:var(--mute)}

.empty{color:var(--mute);font-size:13px;text-align:center;padding:18px 0}

/* ---------- toast / status ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));
  background:var(--navy);color:#fff;padding:11px 16px;border-radius:11px;font-size:14px;z-index:60;
  display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .2s;
  max-width:calc(100% - 28px)}
#toast.on{opacity:1;pointer-events:auto}
#toast span{flex:1 1 auto}
#toast button{border:0;background:#334155;color:#fff;border-radius:7px;padding:7px 11px;font-size:13px;
  font-weight:700;white-space:nowrap;flex:0 0 auto}
#stale{background:#fef3c7;color:#92400e;font-size:12px;text-align:center;padding:6px}

/* ---------- splash / setup ---------- */
#splash{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;background:var(--navy);transition:opacity .3s}
#splash.hide{opacity:0;pointer-events:none}
.mark{font-size:58px;font-weight:900;color:#fff;line-height:1}
.mark::after{content:"";display:block;width:54px;height:5px;border-radius:3px;background:#34c781;margin:12px auto 0}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid #1e293b;border-top-color:#34c781;
  animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

#setup{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;justify-content:center;
  padding:26px calc(22px + env(safe-area-inset-left)) 26px calc(22px + env(safe-area-inset-right));
  background:var(--navy);overflow-y:auto;color:#e2e8f0}
#setup.on{display:flex}
#setup h1{font-size:20px;margin:0 0 6px;color:#fff}
#setup p{font-size:13px;line-height:1.6;color:#94a3b8;margin:0 0 20px}
#setup label{display:block;font-size:12px;color:#94a3b8;margin:16px 0 7px}
#setup input{width:100%;padding:13px;font-size:15px;border-radius:11px;border:1px solid #334155;
  background:#1e293b;color:#e2e8f0}
#setup .who2{display:flex;gap:9px}
#setup .who2 button{flex:1;padding:13px;font-size:15px;font-weight:700;border-radius:11px;
  border:1px solid #334155;background:#1e293b;color:#94a3b8}
#setup .who2 button.sel{border-color:#34c781;background:#14342a;color:#fff}
#go{width:100%;margin-top:24px;padding:15px;font-size:16px;font-weight:800;border:0;border-radius:13px;
  background:#34c781;color:#06281b}
#go:disabled{background:#1e293b;color:#475569}
#err{color:#f87171;font-size:13px;min-height:18px;margin-top:9px}
#hot{position:fixed;top:0;left:0;width:52px;height:52px;z-index:35}
</style>
</head>
<body>

<div id="app" class="hidden">
  <div class="nav">
    <div class="seg">
      <button id="tabIn" class="on">입력</button>
      <button id="tabView">현황</button>
    </div>
    <div class="who" id="whoTag"></div>
  </div>
  <div id="stale" class="hidden">오프라인 — 저장한 내용은 연결되면 자동으로 올라갑니다</div>

  <div class="scroll">
    <!-- ===== 입력 ===== -->
    <div id="viewInput" class="pad">
      <div class="amt">
        <div class="top">
          <input id="dayin" type="date">
          <div id="amtVal" class="val zero">0</div>
        </div>
        <div class="quick">
          <button data-add="1000">+1천</button>
          <button data-add="5000">+5천</button>
          <button data-add="10000">+1만</button>
          <button data-add="50000">+5만</button>
        </div>
      </div>

      <div class="pad3">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button class="sm" data-k="000">000</button><button data-k="0">0</button>
        <button class="sm" data-k="del">지움</button>
      </div>

      <div class="card">
        <div class="lbl">구분</div>
        <div class="chips" id="gubunChips"></div>
      </div>

      <div class="card">
        <div class="lbl">분류</div>
        <div class="chips" id="catChips"></div>
      </div>

      <div class="card">
        <div class="lbl">결제수단 / 계좌</div>
        <div class="chips" id="payChips"></div>
      </div>

      <div class="card">
        <div class="lbl">내용 (선택)</div>
        <input id="memo" type="text" placeholder="예: 이마트 장보기"
               style="width:100%;padding:12px;font-size:15px;border:1px solid var(--line);border-radius:10px">
      </div>

      <button id="save" class="save" disabled>저장</button>

      <div class="card" style="margin-top:12px">
        <div class="lbl">이번 달</div>
        <div class="row"><span style="font-size:13px;color:var(--mute)">지출</span>
          <b id="mSpend" style="font-variant-numeric:tabular-nums">—</b></div>
        <div class="row" style="margin-top:4px"><span style="font-size:13px;color:var(--mute)">예산 대비</span>
          <b id="mBudget" style="font-variant-numeric:tabular-nums;color:var(--mute)">—</b></div>
        <div class="lbl" style="margin:14px 0 6px">최근 입력</div>
        <div class="recent" id="recent"><div style="color:var(--mute)">불러오는 중…</div></div>
      </div>
    </div>

    <!-- ===== 현황 ===== -->
    <div id="viewStat" class="pad hidden">
      <div class="mrow">
        <button id="mPrev">‹</button><span id="ymLabel">—</span><button id="mNext">›</button>
      </div>
      <div id="ovBody"><div class="empty">불러오는 중…</div></div>
    </div>
  </div>
</div>

<div id="splash"><div class="mark">₩</div><div class="spin"></div></div>

<div id="setup">
  <h1>가계부 앱 설정</h1>
  <p>처음 한 번만 설정하면 됩니다.<br>설정은 이 기기에만 저장됩니다.</p>
  <label>앱 주소 (Apps Script 웹앱 URL)</label>
  <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
         placeholder="https://script.google.com/macros/s/…/exec">
  <label>입력자</label>
  <div class="who2"><button type="button" data-who="폴">폴</button><button type="button" data-who="아내">아내</button></div>
  <div id="err"></div>
  <button id="go" disabled>시작하기</button>
</div>

<div id="hot"></div>
<div id="toast"><span id="toastMsg"></span><button id="undo" class="hidden">되돌리기</button></div>

<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
var K = { url:'budget.url', who:'budget.who', master:'budget.master', sum:'budget.sum',
          last:'budget.last', queue:'budget.queue' };

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function jGet(k,d){ try{ return JSON.parse(lsGet(k)) || d; }catch(e){ return d; } }
function jSet(k,v){ lsSet(k, JSON.stringify(v)); }

var BASE = lsGet(K.url) || '';
var WHO  = lsGet(K.who) || '';
var M = null;                       // master data
var S = null;                       // this-month summary
var OV = {};                        // overview cache by ym
var lastRow = 0;

/* ---------------- network ---------------- */
function api(params) {
  var u = BASE + (BASE.indexOf('?') >= 0 ? '&' : '?') +
          Object.keys(params).map(function(k){
            return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
          }).join('&');
  return fetch(u).then(function(r){ return r.json(); }).then(function(j){
    if (!j.ok) throw new Error(j.error || 'error');
    return j.data;
  });
}
function post(body) {
  return fetch(BASE, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); }).then(function(j){
    if (!j.ok) throw new Error(j.error || 'error');
    return j.data;
  });
}

/* ---------------- helpers ---------------- */
function n(x){ return (Number(x)||0).toLocaleString('ko-KR'); }
function today(){
  var d = new Date(), p = function(v){ return (v<10?'0':'')+v; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function ymOf(s){ return s.slice(0,7); }
function shiftM(ym, k){
  var y = +ym.slice(0,4), m = +ym.slice(5,7) - 1 + k;
  y += Math.floor(m/12); m = ((m%12)+12)%12;
  var mm = m + 1;
  return y + '-' + (mm<10?'0':'') + mm;
}

/* ---------------- input state ---------------- */
var amount = 0, gubun = '지출', cat = '', pay = '';

function renderAmount(){
  var el = $('amtVal');
  el.textContent = n(amount);
  el.className = 'val' + (amount ? '' : ' zero');
  var d = $('dayin');
  d.className = (d.value && d.value !== today()) ? 'past' : '';
  $('save').disabled = !(amount > 0 && cat && pay && d.value);
}

function renderGubun(){
  var list = ['지출','수입','저축/투자','부채상환'];
  $('gubunChips').innerHTML = list.map(function(g){
    return '<button class="chip g-'+g+(g===gubun?' on':'')+'" data-g="'+g+'">'+g+'</button>';
  }).join('');
}

function renderCats(){
  var list = (M && M.cats && M.cats[gubun]) || [];
  if (list.indexOf(cat) < 0) cat = '';
  $('catChips').innerHTML = list.length
    ? list.map(function(c){
        var fx = M.fixed && M.fixed[c] ? ' ·고정' : '';
        return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+c+'">'+c+fx+'</button>';
      }).join('')
    : '<span style="color:var(--mute);font-size:13px">분류 없음</span>';
}

function renderPay(){
  var list = (M && M.pay) || [];
  if (list.indexOf(pay) < 0) pay = list.length === 1 ? list[0] : (lsGet('budget.pay') || '');
  if (list.indexOf(pay) < 0) pay = '';
  $('payChips').innerHTML = list.map(function(p){
    return '<button class="chip'+(p===pay?' on':'')+'" data-p="'+p+'">'+p+'</button>';
  }).join('');
}

function renderSummary(){
  if (!S) return;
  $('mSpend').textContent = n(S.spend) + '원';
  $('mBudget').textContent = S.budget ? (n(S.budget) + '원 중 ' + Math.round(S.spend/S.budget*100) + '%') : '예산 미설정';
  var r = S.recent || [];
  $('recent').innerHTML = r.length
    ? r.map(function(x){
        var inc = x.gubun === '수입';
        return '<div><span>'+x.cat+(x.memo?' · '+x.memo:'')+'</span>'+
               '<span class="a'+(inc?' in':'')+'">'+(inc?'+':'')+n(x.amt)+'</span></div>';
      }).join('')
    : '<div style="color:var(--mute)">아직 입력이 없습니다</div>';
}

/* ---------------- overview ---------------- */
function renderOv(o){
  if (!o) { $('ovBody').innerHTML = '<div class="empty">불러오는 중…</div>'; return; }
  var h = '';

  h += '<div class="card"><div class="lbl">순자산</div>'
     + '<div class="big">' + n(o.worth) + '원</div>'
     + '<div class="sub">자산 ' + n(o.asset) + ' · 부채 ' + n(o.liab)
     + (o.delta ? ' · 전월 대비 <b class="' + (o.delta>0?'pos':'neg') + '">'
                  + (o.delta>0?'+':'') + n(o.delta) + '</b>' : '')
     + '</div></div>';

  h += '<div class="card"><div class="lbl">현금흐름</div>'
     + '<div class="kv"><span>수입</span><b class="pos">' + n(o.income) + '</b></div>'
     + '<div class="kv"><span>지출</span><b class="neg">' + n(o.spend) + '</b></div>'
     + '<div class="kv"><span>저축·투자</span><b>' + n(o.save) + '</b></div>'
     + '<div class="kv"><span>부채상환</span><b>' + n(o.debt) + '</b></div>'
     + '<div class="kv"><span>순현금흐름</span><b class="' + (o.net>=0?'pos':'neg') + '">'
       + (o.net>0?'+':'') + n(o.net) + '</b></div>'
     + '<div class="kv"><span>저축률</span><b>' + (o.rate ? Math.round(o.rate*100)+'%' : '—') + '</b></div>'
     + '<div class="kv"><span>고정비 / 변동비</span><b>' + n(o.fixed) + ' / ' + n(o.vari) + '</b></div>'
     + '</div>';

  var cats = (o.cats || []).filter(function(c){ return c.spend > 0 || c.budget > 0; })
                           .sort(function(a,b){ return b.spend - a.spend; });
  h += '<div class="card"><div class="lbl">카테고리별 지출</div>';
  if (!cats.length) h += '<div class="empty">이 달 지출이 없습니다</div>';
  cats.forEach(function(c){
    var pct = c.budget ? Math.min(c.spend / c.budget, 1.6) : 0;
    var cls = !c.budget ? '' : (c.spend > c.budget ? ' over' : (c.spend > c.budget*0.85 ? ' warn' : ''));
    h += '<div class="catline"><div class="row"><span>'+c.cat+'</span>'
       + '<b>'+n(c.spend)+(c.budget?' <span style="color:var(--mute);font-weight:400">/ '+n(c.budget)+'</span>':'')+'</b></div>'
       + '<div class="track"><i class="'+cls.trim()+'" style="width:'+Math.min(pct*100,100)+'%"></i></div></div>';
  });
  h += '</div>';

  var tr = o.trend || [];
  var mx = Math.max(1, Math.max.apply(null, tr.map(function(t){ return Math.max(t.income, t.spend); })));
  h += '<div class="card"><div class="lbl">최근 6개월 (초록 수입 · 빨강 지출)</div><div class="bars">';
  tr.forEach(function(t){
    h += '<div class="b"><div class="stack">'
       + '<i class="inc" style="height:'+(t.income/mx*100)+'%"></i>'
       + '<i class="exp" style="height:'+(t.spend/mx*100)+'%"></i>'
       + '</div><small>'+t.m.slice(5)+'</small></div>';
  });
  h += '</div></div>';

  $('ovBody').innerHTML = h;
}

var curYm = ymOf(today());
function loadOv(ym, force){
  curYm = ym;
  $('ymLabel').textContent = ym;
  if (OV[ym] && !force) { renderOv(OV[ym]); return; }
  renderOv(null);
  api({ api:'overview', ym:ym }).then(function(o){
    OV[ym] = o; if (curYm === ym) renderOv(o);
  }).catch(function(e){
    $('ovBody').innerHTML = '<div class="empty">불러오지 못했습니다<br><small>'+e.message+'</small></div>';
  });
}

/* ---------------- toast ---------------- */
var toastT;
function toast(msg, undoRow){
  $('toastMsg').textContent = msg;
  $('undo').className = undoRow ? '' : 'hidden';
  lastRow = undoRow || 0;
  $('toast').classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ $('toast').classList.remove('on'); }, undoRow ? 6000 : 2600);
}

/* ---------------- save ---------------- */
function doSave(){
  var d = $('dayin').value;
  var payload = { api:'add', date:d, gubun:gubun, cat:cat, pay:pay, user:WHO,
                  amount:amount, memo:$('memo').value.trim(),
                  fv:(M.fixed && M.fixed[cat]) ? '고정' : '변동' };
  var btn = $('save');
  btn.disabled = true; btn.className = 'save busy'; btn.textContent = '저장 중…';

  post(payload).then(function(res){
    S = res.summary; renderSummary(); jSet(K.sum, S);
    OV = {};                                  // 현황 캐시 무효화
    amount = 0; $('memo').value = '';
    renderAmount();
    btn.className = 'save'; btn.textContent = '저장';
    var pre = (d !== today()) ? (d.slice(5).replace('-','/') + ' ') : '';
    toast(pre + cat + ' ' + n(payload.amount) + '원 저장', res.row);
  }).catch(function(e){
    btn.disabled = false; btn.className = 'save'; btn.textContent = '저장';
    toast('저장 실패: ' + e.message);
  });
}

/* ---------------- boot ---------------- */
function paint(){
  renderGubun(); renderCats(); renderPay(); renderAmount(); renderSummary();
}

function start(){
  $('setup').classList.remove('on');
  $('whoTag').textContent = WHO;
  $('dayin').value = today();

  M = jGet(K.master, null);
  S = jGet(K.sum, null);

  if (M) {                                    // 캐시가 있으면 즉시 화면 표시
    $('app').classList.remove('hidden');
    $('splash').classList.add('hide');
    paint();
  }

  api({ api:'master' }).then(function(m){
    M = m; jSet(K.master, m);
    if ($('app').classList.contains('hidden')) {
      $('app').classList.remove('hidden'); $('splash').classList.add('hide');
    }
    paint();
  }).catch(function(e){
    if (!M) {
      $('splash').innerHTML = '<div class="mark">₩</div>'
        + '<div style="color:#94a3b8;font-size:13px;text-align:center;padding:0 30px">'
        + '연결하지 못했습니다<br><small>' + e.message + '</small></div>';
    }
  });

  api({ api:'summary' }).then(function(s){
    S = s; jSet(K.sum, s); renderSummary();
  }).catch(function(){});
}

/* ---------------- setup screen ---------------- */
var who = WHO;
function syncSetup(){
  var u = $('url').value.trim();
  var valid = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(u) && !!who;
  $('go').disabled = !valid;
  $('err').textContent = (u && !/^https:\/\/script\.google\.com\/macros\/s\//.test(u))
    ? 'script.google.com 으로 시작하는 /exec 주소를 넣어주세요.' : '';
}
function showSetup(){
  $('splash').classList.add('hide');
  $('app').classList.add('hidden');
  $('setup').classList.add('on');
  $('url').value = BASE; who = WHO;
  [].forEach.call(document.querySelectorAll('.who2 button'), function(b){
    b.classList.toggle('sel', b.dataset.who === who);
  });
  syncSetup();
}

/* ---------------- events ---------------- */
document.addEventListener('click', function(ev){
  var t = ev.target.closest('button');
  if (!t) return;

  if (t.dataset.k !== undefined) {
    var k = t.dataset.k;
    if (k === 'del') amount = Math.floor(amount / 10);
    else if (k === '000') amount = amount * 1000;
    else amount = amount * 10 + (+k);
    if (amount > 999999999) amount = 999999999;
    renderAmount(); return;
  }
  if (t.dataset.add) { amount += (+t.dataset.add); renderAmount(); return; }
  if (t.dataset.g) { gubun = t.dataset.g; renderGubun(); renderCats(); renderAmount(); return; }
  if (t.dataset.c) { cat = t.dataset.c; renderCats(); renderAmount(); return; }
  if (t.dataset.p) { pay = t.dataset.p; lsSet('budget.pay', pay); renderPay(); renderAmount(); return; }
  if (t.dataset.who) {
    who = t.dataset.who;
    [].forEach.call(document.querySelectorAll('.who2 button'), function(b){ b.classList.toggle('sel', b === t); });
    syncSetup(); return;
  }

  if (t.id === 'save')  { doSave(); return; }
  if (t.id === 'undo')  {
    var r = lastRow; $('toast').classList.remove('on');
    if (!r) return;
    post({ api:'undo', row:r }).then(function(res){
      S = res.summary; renderSummary(); jSet(K.sum, S); OV = {};
      toast('되돌렸습니다');
    }).catch(function(e){ toast('되돌리기 실패: ' + e.message); });
    return;
  }
  if (t.id === 'mPrev') { loadOv(shiftM(curYm, -1)); return; }
  if (t.id === 'mNext') { loadOv(shiftM(curYm,  1)); return; }
  if (t.id === 'tabIn') {
    $('tabIn').classList.add('on'); $('tabView').classList.remove('on');
    $('viewInput').classList.remove('hidden'); $('viewStat').classList.add('hidden'); return;
  }
  if (t.id === 'tabView') {
    $('tabView').classList.add('on'); $('tabIn').classList.remove('on');
    $('viewStat').classList.remove('hidden'); $('viewInput').classList.add('hidden');
    loadOv(curYm); return;
  }
  if (t.id === 'go') {
    BASE = $('url').value.trim(); WHO = who;
    lsSet(K.url, BASE); lsSet(K.who, WHO);
    $('setup').classList.remove('on');
    localStorage.removeItem(K.master); localStorage.removeItem(K.sum);
    M = null; S = null; OV = {};
    start(); return;
  }
});

document.addEventListener('change', function(ev){
  if (ev.target.id === 'dayin') renderAmount();
});
$('url').addEventListener('input', syncSetup);

var taps = [];
$('hot').addEventListener('click', function(){
  var now = +new Date();
  taps = taps.filter(function(t){ return now - t < 1200; });
  taps.push(now);
  if (taps.length >= 3) { taps = []; showSetup(); }
});

function netState(){ $('stale').classList.toggle('hidden', navigator.onLine !== false); }
window.addEventListener('online', function(){ netState(); start(); });
window.addEventListener('offline', netState);
netState();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}

/* one-tap setup via #hash (never sent to a server) */
(function(){
  var h = location.hash.replace(/^#/, '');
  if (!h) return;
  var got = false;
  h.split('&').forEach(function(kv){
    var i = kv.indexOf('='); if (i < 0) return;
    var k = kv.slice(0,i), v = decodeURIComponent(kv.slice(i+1).replace(/\+/g,' '));
    if (k === 'a') { BASE = v; lsSet(K.url, v); got = true; }
    if (k === 'u') { WHO  = v; lsSet(K.who, v); got = true; }
  });
  if (got) {
    localStorage.removeItem(K.master); localStorage.removeItem(K.sum);
    history.replaceState(null, '', location.pathname + location.search);
  }
})();

if (/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(BASE) && WHO) start();
else showSetup();
})();
</script>
