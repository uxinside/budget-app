<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>우리집 가계부</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0B1120">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./favicon.png">
<style>
html,body{margin:0;padding:0;height:100%;background:#0B1120;overscroll-behavior:none}
#f{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0B1120}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
text-align:center;background:#0B1120;color:#94A3B8;
font:14px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
</style>
</head><body>
<div id="msg">불러오는 중…</div>
<iframe id="f" src="https://script.google.com/macros/s/AKfycbyTjmbMOGKacDaMMhmCRje4iQYvgb7XouOmzpiij62BW8uaZfqu9fa1Q139nz9tdQBbgw/exec"></iframe>
<script>
var f=document.getElementById('f'),m=document.getElementById('msg');
f.addEventListener('load',function(){m.style.display='none'});
setTimeout(function(){if(m.style.display!=='none')m.textContent='앱을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 열어주세요.'},15000);
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('./sw.js')}catch(e){}}
</script>
</body></html>
