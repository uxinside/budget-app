<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>우리집 가계부</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FAF8F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=Noto+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./app.css?v=1.32.0">
</head>
<body>

<div id="login" hidden>
  <div class="lgtop">
    <div class="logo"><svg viewBox="0 0 52 52" fill="none" aria-hidden="true"><path d="M8 22 L26 8 L44 22" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="15" y="29" width="22" height="4.5" rx="2.25" fill="currentColor"/><rect x="15" y="38" width="13" height="4.5" rx="2.25" fill="currentColor" opacity=".45"/></svg></div>
    <h1>우리집 가계부</h1>
    <p id="lgsub">한 달 손익 · 예산 페이스 · 누가 얼마나 썼는지<br>부부가 같은 숫자를 봅니다</p>
  </div>
  <div class="lgmid">
    <div id="gbtn"></div>
    <div id="lgnote" class="lgnote"></div>
    <div id="lerr" class="err" hidden></div>
  </div>
  <div class="lgfoot">
    <details id="lghelp">
      <summary>로그인이 안 되나요?</summary>
      <p><b>&ldquo;등록되지 않은 계정입니다&rdquo;</b> 가 나오면 가족 계정으로 등록되지 않은
      구글 계정입니다. 이미 쓰고 있는 가족에게 등록을 요청하세요.</p>
    </details>
    <span id="lgver"></span>
  </div>
</div>

<div id="app" hidden>
  <div class="hd">
    <div class="logo"><svg viewBox="0 0 52 52" fill="none" aria-hidden="true"><path d="M8 22 L26 8 L44 22" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="15" y="29" width="22" height="4.5" rx="2.25" fill="currentColor"/><rect x="15" y="38" width="13" height="4.5" rx="2.25" fill="currentColor" opacity=".45"/></svg></div>
    <div class="mnav">
      <button id="mprev" aria-label="이전 달">‹</button>
      <b id="mlabel">—</b>
      <button id="mnext" aria-label="다음 달">›</button>
    </div>
    <button class="who" id="whobtn">
      <span class="av" id="whoav">·</span>
      <span class="nm" id="whonm">—</span>
      <span class="sw">⇄</span>
    </button>
  </div>
  <div id="screen"></div>
</div>

<nav class="tb" id="tb" hidden>
  <button data-tab="home" class="on"><span>홈</span></button>
  <button data-tab="tx">내역</button>
  <div class="fab" id="fab">+</div>
  <button data-tab="report">리포트</button>
  <button data-tab="settings">설정</button>
</nav>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./app.js?v=1.32.0"></script>
</body>
</html>
