<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>우리집 가계부</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./favicon.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0f172a; color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", "Malgun Gothic", sans-serif;
    overscroll-behavior: none;
  }

  /* ---- app frame ---- */
  #wrap {
    position: fixed; inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: #0f172a;
  }
  #frame { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

  /* ---- splash ---- */
  #splash {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #0f172a;
    transition: opacity .35s ease;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  .mark {
    font-size: 62px; font-weight: 900; color: #fff; line-height: 1;
    letter-spacing: -2px;
  }
  .mark::after {
    content: ""; display: block; width: 58px; height: 5px; border-radius: 3px;
    background: #34c781; margin: 14px auto 0;
  }
  .hint { font-size: 13px; color: #64748b; }
  .spin {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid #1e293b; border-top-color: #34c781;
    animation: sp .8s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ---- setup ---- */
  #setup {
    position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; justify-content: center;
    padding: 28px calc(24px + env(safe-area-inset-left)) 28px calc(24px + env(safe-area-inset-right));
    background: #0f172a; overflow-y: auto;
  }
  #setup.on { display: flex; }
  h1 { font-size: 21px; margin: 0 0 6px; color: #fff; }
  p.sub { font-size: 13px; line-height: 1.6; color: #94a3b8; margin: 0 0 24px; }
  label { display: block; font-size: 12px; color: #94a3b8; margin: 18px 0 8px; }
  input[type=url] {
    width: 100%; padding: 14px; font-size: 15px; border-radius: 12px;
    border: 1px solid #334155; background: #1e293b; color: #e2e8f0;
  }
  input[type=url]:focus { outline: none; border-color: #34c781; }
  .who { display: flex; gap: 10px; }
  .who button {
    flex: 1; padding: 14px; font-size: 15px; font-weight: 700; border-radius: 12px;
    border: 1px solid #334155; background: #1e293b; color: #94a3b8;
  }
  .who button.sel { border-color: #34c781; background: #14342a; color: #fff; }
  #go {
    width: 100%; margin-top: 28px; padding: 16px; font-size: 16px; font-weight: 700;
    border: 0; border-radius: 14px; background: #34c781; color: #06281b;
  }
  #go:disabled { background: #1e293b; color: #475569; }
  #err { color: #f87171; font-size: 13px; min-height: 18px; margin-top: 10px; }

  /* ---- invisible settings hotspot (top-left, triple tap) ---- */
  #hot { position: fixed; top: 0; left: 0; width: 52px; height: 52px; z-index: 15; }

  /* ---- offline ---- */
  #off {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: none;
    padding: 12px calc(16px + env(safe-area-inset-bottom));
    background: #7f1d1d; color: #fee2e2; font-size: 13px; text-align: center;
  }
  #off.on { display: block; }
</style>
</head>
<body>

<div id="wrap"><iframe id="frame" allow="clipboard-write" referrerpolicy="no-referrer"></iframe></div>

<div id="splash">
  <div class="mark">₩</div>
  <div class="spin"></div>
  <div class="hint">가계부 불러오는 중…</div>
</div>

<div id="setup">
  <h1>가계부 앱 설정</h1>
  <p class="sub">처음 한 번만 설정하면 됩니다.<br>설정은 이 기기에만 저장됩니다.</p>

  <label>앱 주소 (Apps Script 웹앱 URL)</label>
  <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off"
         spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">

  <label>입력자</label>
  <div class="who">
    <button type="button" data-who="폴">폴</button>
    <button type="button" data-who="아내">아내</button>
  </div>

  <div id="err"></div>
  <button id="go" disabled>시작하기</button>
</div>

<div id="hot"></div>
<div id="off">인터넷 연결이 끊겼습니다. 연결되면 자동으로 다시 불러옵니다.</div>

<script>
(function () {
  var K_URL = 'budget.url', K_WHO = 'budget.who';
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ---------- 1. one-tap setup via #hash (never sent to any server) ---------- */
  function readHash() {
    var h = location.hash.replace(/^#/, '');
    if (!h) return null;
    var out = {}, ok = false;
    h.split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i < 0) return;
      var k = kv.slice(0, i), v = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' '));
      if (k === 'a' || k === 'u') { out[k] = v; ok = true; }
    });
    return ok ? out : null;
  }
  var h = readHash();
  if (h) {
    if (h.a) store.set(K_URL, h.a);
    if (h.u) store.set(K_WHO, h.u);
    history.replaceState(null, '', location.pathname + location.search);
  }

  /* ---------- 2. boot ---------- */
  function appSrc() {
    var u = store.get(K_URL), who = store.get(K_WHO);
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(u)) return '';
    return u + (u.indexOf('?') >= 0 ? '&' : '?') + 'u=' + encodeURIComponent(who || '');
  }

  function boot() {
    var src = appSrc();
    if (!src) { showSetup(); return; }
    $('setup').classList.remove('on');
    $('splash').classList.remove('hide');
    $('frame').src = src;
  }

  $('frame').addEventListener('load', function () {
    setTimeout(function () { $('splash').classList.add('hide'); }, 250);
  });

  /* ---------- 3. setup screen ---------- */
  var who = store.get(K_WHO) || '';
  function sync() {
    var u = $('url').value.trim();
    var valid = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(u) && !!who;
    $('go').disabled = !valid;
    $('err').textContent =
      (u && !/^https:\/\/script\.google\.com\/macros\/s\//.test(u))
        ? 'script.google.com 으로 시작하는 /exec 주소를 넣어주세요.' : '';
  }
  function showSetup() {
    $('splash').classList.add('hide');
    $('setup').classList.add('on');
    $('url').value = store.get(K_URL);
    who = store.get(K_WHO) || '';
    Array.prototype.forEach.call(document.querySelectorAll('.who button'), function (b) {
      b.classList.toggle('sel', b.dataset.who === who);
    });
    sync();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.who button'), function (b) {
    b.addEventListener('click', function () {
      who = b.dataset.who;
      Array.prototype.forEach.call(document.querySelectorAll('.who button'), function (x) {
        x.classList.toggle('sel', x === b);
      });
      sync();
    });
  });
  $('url').addEventListener('input', sync);
  $('go').addEventListener('click', function () {
    store.set(K_URL, $('url').value.trim());
    store.set(K_WHO, who);
    boot();
  });

  /* ---------- 4. hidden settings: 3 quick taps on the top-left corner ---------- */
  var taps = [], t0;
  $('hot').addEventListener('click', function () {
    var now = Date.now();
    taps = taps.filter(function (t) { return now - t < 1200; });
    taps.push(now);
    if (taps.length >= 3) { taps = []; showSetup(); }
  });

  /* ---------- 5. offline banner ---------- */
  function net() {
    var down = navigator.onLine === false;
    $('off').classList.toggle('on', down);
    if (!down && $('frame').src && !$('frame').contentWindow) boot();
  }
  window.addEventListener('online', function () { $('off').classList.remove('on'); boot(); });
  window.addEventListener('offline', net);
  net();

  /* ---------- 6. service worker (shell only) ---------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }

  boot();
})();
</script>
</body>
</html>
